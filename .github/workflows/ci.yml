name: CI

on:
  pull_request:
    branches: [staging]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Clerk publishable key is public (embedded in client JS) so safe in CI
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      # Sentry (source map upload during build)
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      # Dummy values for build — no real calls are made during static generation
      DATABASE_URL: postgresql://placeholder:placeholder@localhost/placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_STARTER_PRICE_ID: price_placeholder
      STRIPE_PRO_PRICE_ID: price_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
